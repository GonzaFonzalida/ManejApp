version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: manejapp-db-dev
    environment:
      POSTGRES_DB: manejapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - manejapp-network

  # Backend de la aplicación (desarrollo)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: manejapp-backend-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/manejapp
      JWT_SECRET: your-super-secret-jwt-key-minimum-32-characters-long
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-minimum-32-characters-long
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      COOKIE_SECRET: your-super-secret-cookie-key-minimum-32-characters-long
      LOG_LEVEL: debug
      ENABLE_CONSOLE_LOGS: true
      ENABLE_FILE_LOGS: true
      ENABLE_DATABASE_LOGS: false
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./prisma:/app/prisma
    networks:
      - manejapp-network
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  manejapp-network:
    driver: bridge