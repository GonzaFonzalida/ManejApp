name: Backend Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: manejapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/manejapp_test

    - name: Run Tests
      # We skip the explicit Testcontainers setup in CI if we use the service container above,
      # BUT our tests are hardcoded to use Testcontainers via global-setup.
      # To behave correctly in CI, we might want to detect CI and skip Testcontainers? 
      # OR just let Testcontainers run (DIND / Docker socket). Ubuntu runners have Docker.
      # Using Testcontainers is more robust as it ensures same env locally and in CI.
      # So we actually DON'T need the postgres service above if we rely on Testcontainers.
      # However, having it doesn't hurt, but Testcontainers will spin up its own on a random port.
      run: npm test
      env:
        CI: true
