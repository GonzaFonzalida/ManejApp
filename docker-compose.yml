version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: manejapp-db
    environment:
      POSTGRES_DB: manejapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - manejapp-network

  # Backend de la aplicación
  backend:
    build: .
    container_name: manejapp-backend
    environment:
      NODE_ENV: production
      PORT: 3099
      DATABASE_URL: postgresql://postgres:password@postgres:5432/manejapp
      JWT_SECRET: your-super-secret-jwt-key-minimum-32-characters-long
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-minimum-32-characters-long
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      COOKIE_SECRET: your-super-secret-cookie-key-minimum-32-characters-long
      LOG_LEVEL: info
      ENABLE_CONSOLE_LOGS: false
      ENABLE_FILE_LOGS: true
      ENABLE_DATABASE_LOGS: true
    ports:
      - "3099:3099"
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs
    networks:
      - manejapp-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  manejapp-network:
    driver: bridge